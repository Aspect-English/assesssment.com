<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快速檢測題庫批次匯入</title><style>body{font:16px system-ui;max-width:850px;margin:35px auto;padding:0 18px;color:#24203c}button{background:#6747bd;color:white;border:0;padding:12px 18px;border-radius:9px;cursor:pointer}button:disabled{opacity:.4}pre{background:#f5f2fb;padding:16px;white-space:pre-wrap;border-radius:9px}li{margin:7px 0}</style><h1>快速檢測題庫｜安全批次匯入</h1><p>僅使用老師登入權限與現有 Supabase RLS。題目全部先設為 Draft，避免缺少圖片、音檔時誤發布。</p><p><a href="teacher.html">返回老師後台</a></p><p id="auth">正在檢查老師身分…</p><ul id="preview"></ul><label><input type="checkbox" id="confirm"> 我已確認將新增題目，且不會覆蓋同代碼題目。</label><p><button id="go" disabled>開始匯入（只新增、不覆蓋）</button></p><pre id="log">尚未匯入。</pre><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="supabase-service.js"></script><script src="auth-service.js"></script><script>
(async()=>{const log=document.querySelector('#log'),go=document.querySelector('#go'),confirm=document.querySelector('#confirm');let items;try{const profile=await requireTeacherAccess();if(!profile)return;const response=await fetch('quick-question-bank.json');if(!response.ok)throw Error('題庫 JSON 讀取失敗');items=await response.json();document.querySelector('#auth').textContent='已驗證老師身分；預備匯入 '+items.length+' 題。';document.querySelector('#preview').innerHTML=items.map(x=>'<li>'+x.question_code+' — '+x.title+'</li>').join('');confirm.onchange=()=>go.disabled=!confirm.checked;go.onclick=async()=>{go.disabled=true;let created=0,updated=0,skipped=0,errors=[];for(const q of items){const {data,error}=await supabaseClient.from('question_bank').select('id').eq('question_code',q.question_code).limit(1);if(error){errors.push(q.question_code+': '+error.message);continue}if(data.length){
  if(q.image_url && ['QUICK-SPK-P2-001','QUICK-SPK-P2-002','QUICK-WRT-P1-001'].includes(q.question_code)){
    const upd=await supabaseClient.from('question_bank').update({image_url:q.image_url,title:q.title,prompt:q.prompt}).eq('question_code',q.question_code);
    if(upd.error)errors.push(q.question_code+': '+upd.error.message);
    else updated++;
  }else{skipped++;}
  continue;
}const r=await supabaseClient.from('question_bank').insert(q);if(r.error)errors.push(q.question_code+': '+r.error.message);else created++;}log.textContent='新增 '+created+' 題；已更新圖片 '+updated+' 題；已存在跳過 '+skipped+' 題；失敗 '+errors.length+' 題。\n'+errors.join('\n')+'\n請到題庫管理補齊必要圖片與音檔，再啟用題目並組卷。';};}catch(e){document.querySelector('#auth').textContent='無法匯入：'+e.message;}})();
</script></html>
