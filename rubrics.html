<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>評分標準管理 V9.0.0</title><style> *{box-sizing:border-box}body{margin:0;background:#f4f3f9;color:#29243e;font:16px system-ui}header{background:#241d40;color:white;padding:20px}main{max-width:1000px;margin:auto;padding:24px}section{background:white;border:1px solid #e2ddec;border-radius:14px;padding:22px;margin-bottom:16px}label{display:block;margin:12px 0 5px;font-weight:600}input,textarea,select{width:100%;padding:10px;border:1px solid #c8c3d6;border-radius:8px;font:inherit}button{background:#6245b5;color:white;border:0;border-radius:8px;padding:12px 18px;margin:12px 8px 0 0;cursor:pointer}button:disabled{opacity:.4;cursor:default}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.muted{color:#655e78;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere}h2{font-size:20px} </style></head><body><header>ASPECT ENGLISH · Teacher Portal <a href="teacher.html" style="float:right">返回老師後台</a></header><main><h1>評分標準管理 <small>V9.0.0</small></h1><p id="auth">驗證登入中…</p><section><label for="type">選擇 Part</label><select id="type"></select></section><section><h2>各 Part 評分標準</h2><p>依題型套用預設級距；下列為教學用摘要，非 ETS 官方逐字規準。</p><div id="rubric"></div><button id="rubricSave" disabled>儲存此 Part 評分標準</button><p id="rubricStatus" role="status"></p></section><section hidden><h2>01｜文字匯入</h2><div class="grid"><div><label for="book">題本／題組代碼</label><input id="book" placeholder="BOOK01" maxlength="40"></div></div><label for="shared">共用文章、情境或資訊（P3、P4、寫作 P2）</label><textarea id="shared" rows="4"></textarea><label for="text">題目文字</label><textarea id="text" rows="10" placeholder="Question 1&#10;題目文字&#10;&#10;Question 2&#10;題目文字"></textarea><p class="muted">一次匯入同一 Part。題號請獨立成行（Question 1 或 Q1）。沒有題號時視為單題。口說 P3 必須使用 Q5–Q7，P4 使用 Q8–Q10。寫作 P2 每次匯入一題，將 Email 放在共用文章欄。</p><button id="parse" disabled>解析並預覽</button></section><section hidden><h2>02｜預覽、修改及附加素材</h2><div id="rows">尚未解析</div><button id="save" disabled>確認新增草稿至 Supabase</button><pre id="log" role="status"></pre></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-service.js"></script><script src="auth-service.js"></script><script src="question-editor-service.js"></script><script src="bulk-bank-import.js?v=8.0.8"></script></body></html>
